# ╭──────────────────────────────────────────────────────────────╮
# │                 TrickierTrials  ·  Paper 26.2                 │
# │   Waves, bosses, elites, combos and leaderboards for every   │
# │                    Trial Chamber you own.                    │
# ╰──────────────────────────────────────────────────────────────╯
# Messages use MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Every palette colour below can be used as a tag (<copper>text</copper>) and inside
# gradients (<gradient:copper:gold>text</gradient>).

config-version: 6

palette:
  copper: "#E8875B"   # warm copper - main accent
  gold: "#F7C873"     # rewards / highlights
  teal: "#5CC8B5"     # oxidised copper - waves
  sky: "#9AD8FF"      # breeze / wind
  ominous: "#A974FF"  # ominous trials & bosses
  danger: "#FF5E6C"   # damage, deaths, enrage
  success: "#7EE081"  # victories
  muted: "#9A9AA6"    # tuff grey - secondary text
  light: "#F3EEE7"    # main text

# ──────────────────────────── Chamber protection ────────────────────────────
chamber-protection:
  enabled: true
  # Broken chamber blocks drop nothing and grow back.
  regenerate-broken-blocks: true
  regenerate-delay: 10          # seconds (+ up to 5 random seconds)
  # Blocks placed by players inside a chamber vanish again.
  decay-placed-blocks: true
  decay-delay: 10               # seconds
  mining-fatigue-level: 2       # 0 disables mining fatigue while breaking chamber blocks
  blocks-to-protect:
    - COPPER_BLOCK
    - WAXED_COPPER_BLOCK
    - WEATHERED_COPPER
    - WAXED_WEATHERED_COPPER
    - EXPOSED_COPPER
    - WAXED_EXPOSED_COPPER
    - OXIDIZED_COPPER
    - WAXED_OXIDIZED_COPPER
    - CUT_COPPER
    - WAXED_CUT_COPPER
    - OXIDIZED_CUT_COPPER
    - WAXED_OXIDIZED_CUT_COPPER
    - WAXED_CHISELED_COPPER
    - WAXED_OXIDIZED_CHISELED_COPPER
    - POLISHED_TUFF
    - TUFF_BRICKS
    - CHISELED_TUFF_BRICKS
    - CHISELED_TUFF
    - WAXED_CUT_COPPER_STAIRS
    - WAXED_OXIDIZED_CUT_COPPER_STAIRS
    - WAXED_OXIDIZED_CUT_COPPER_SLAB
    - WAXED_CUT_COPPER_SLAB
    - WAXED_COPPER_GRATE
    - WAXED_OXIDIZED_COPPER_GRATE
    - LADDER
    - LIGHT_GRAY_STAINED_GLASS
    - WAXED_COPPER_BULB
    - WAXED_EXPOSED_COPPER_BULB
    - WAXED_WEATHERED_COPPER_BULB
    - WAXED_OXIDIZED_COPPER_BULB

# ──────────────────────────────── Trial mobs ────────────────────────────────
trial-mobs:
  strengthen: true
  glowing: true
  # Mobs read the average gear of nearby players and pick a tier (armor, weapons, stats).
  gear-scaling: true
  # Extra health / damage for every player beyond the first in the encounter.
  per-extra-player:
    health: 0.15
    damage: 0.05
  # The only mobs TrickierTrials will ever spawn itself (reinforcements, boss minions, Splitting elites).
  # Defaults to everything a vanilla trial spawner spawns. Bosses whose mob is missing here are skipped.
  mob-pool: [BREEZE, BOGGED, ZOMBIE, HUSK, SKELETON, STRAY, SPIDER, CAVE_SPIDER, SLIME, SILVERFISH]
  # Trial mobs only drop these items (prevents armor / weapon farming).
  restrict-drops: true
  allowed-drops: [BREEZE_ROD, ROTTEN_FLESH, BONE, ARROW, STRING, SPIDER_EYE, SLIME_BALL, TIPPED_ARROW]
  easter-egg: false
  easter-egg-name: "Klein Tiade"

# ──────────────────────────────── Elite mobs ────────────────────────────────
# Diablo-style affixes: Swift, Brutal, Vampiric, Molten, Frostbite, Venomous,
# Volatile, Shielded, Galeborn, Splitting, Undying.
elites:
  enabled: true
  base-chance: 0.08
  chance-per-wave: 0.02
  max-chance: 0.45
  ominous-bonus: 0.10
  health-bonus: 0.40
  bonus-exp: 15
  key-drop-chance: 0.04        # chance for an elite to drop a Trial Key
  disabled-affixes: []

# ────────────────────────────────── Waves ───────────────────────────────────
# An encounter starts the moment a trial spawner spawns its first mob. Kill trial mobs to fill
# the wave bar. Mobs come from the chamber's real trial spawners: at every wave (and whenever the
# fight runs dry) spawners on cooldown are woken up and run their vanilla activation again.
waves:
  kills-base: 8
  kills-per-extra-player: 4
  kills-per-wave: 2
  health-per-wave: 0.08        # +8% mob health per wave
  damage-per-wave: 0.05        # +5% mob damage per wave
  boss-every: 3                # every Nth wave is a boss wave
  final-wave: 9                # beating this wave conquers the chamber. 0 = endless
  intermission: 6              # seconds between waves
  wave-clear-heal: 6.0         # health restored to every player when a wave is cleared
  reinforcements: true
  clear-mobs-on-wave-clear: true # leftover trial mobs vanish when a wave is cleared
  reinforcement-delay: 5       # seconds without living mobs before spawners are woken / reinforcements arrive
  wake-spawners: true          # reactivate the chamber's own trial spawners for every wave
  # If no trial spawner near the players can be woken (or the wave is stuck for 45s), spawn
  # trial mobs directly at the nearest spawner so the wave can always finish.
  fallback-spawns: true
  # Woken spawners only drop their vanilla trial-key loot once per encounter (prevents farming).
  spawner-rewards-once: true

# ────────────────────────────────── Bosses ──────────────────────────────────
bosses:
  enabled: true
  health-per-extra-player: 0.5   # +50% boss health per extra player
  ominous-multiplier: 1.4        # stat multiplier in ominous chambers
  final-multiplier: 1.5          # stat multiplier for the final boss
  enrage-threshold: 0.35         # bosses enrage below this health fraction
  experience: 120
  types:
    tempest:
      enabled: true
      name: "<gradient:sky:teal><bold>Tempest, the Howling Gale</bold></gradient>"
      health: 260
      damage: 1.0
    bog-sovereign:
      enabled: true
      name: "<gradient:success:teal><bold>The Bog Sovereign</bold></gradient>"
      health: 240
      damage: 1.0
    juggernaut:
      enabled: true
      name: "<gradient:copper:danger><bold>Copperclad Juggernaut</bold></gradient>"
      health: 380
      damage: 1.0
    brood-mother:
      enabled: true
      name: "<gradient:danger:ominous><bold>Vexa, the Brood Mother</bold></gradient>"
      health: 280
      damage: 1.0
    rimeborn:
      enabled: true
      name: "<gradient:light:sky><bold>The Rimeborn Marksman</bold></gradient>"
      health: 230
      damage: 1.0
  # Dropped when a boss dies. Format: "MATERIAL amount chance". Amounts scale with player count.
  # Regular Trial Keys by default, so the chamber's vaults stay the real reward.
  rewards:
    - "TRIAL_KEY 1 1.0"
  # Given to every player when the final wave is beaten.
  victory-rewards:
    - "TRIAL_KEY 1 1.0"

# ─────────────────────────────── Trial Rank ─────────────────────────────────
# Conquering chambers moves players towards the next Trial Rank. A group plays at the average rank of
# its members, so veterans always face a harder (and more rewarding) trial than newcomers.
progression:
  enabled: true
  max-rank: 20
  # Conquered chambers needed for each rank (1st number = rank 1 ... 20th = rank 20). Default: 121 total.
  wins-per-rank: [3, 3, 3, 4, 4, 4, 5, 5, 5, 6, 6, 6, 7, 7, 7, 8, 8, 8, 10, 12]
  require-own-rank: true         # a win only counts if the trial's rank was at least your own rank
  max-deaths: 1                  # a win only counts if you died at most this often (-1 = no limit)
  join-by-wave: 2                # a win only counts if you were there by this wave (0 = no limit)
  failure-penalty: 1             # a failed trial removes this many wins of progress (never a whole rank)
  health-per-rank: 0.05          # +5% mob health per rank (rank 20 = +100%)
  damage-per-rank: 0.03          # +3% mob damage per rank (rank 20 = +60%)
  elite-chance-per-rank: 0.015
  boss-health-per-rank: 0.06
  boss-affix-rank: 5             # bosses gain an elite affix from this rank (two at double). 0 = never
  reward-bonus-per-rank: 0.15    # victory Trial Keys x(1 + 0.15 per rank)
  score-bonus-per-rank: 0.06

# Badge for every rank (index = rank, 0-20). One symbol: the SHAPE shows the tier, the brightness
# shows the step inside it (dim -> normal -> bright). &#RRGGBB colours. Shown in /trials and through
# the PlaceholderAPI placeholders %trickiertrials_rank_stars% / %trickiertrials_rank_stars_hex%.
rank-badges:
  - ""                  # 0  unranked (shows nothing)
  - "&#9C6A3C✧"         # 1  Bronze
  - "&#CD7F32✧"         # 2
  - "&#E8A060✧"         # 3
  - "&#8F8F8F✦"         # 4  Silver
  - "&#C0C0C0✦"         # 5
  - "&#E6E6E6✦"         # 6
  - "&#C9A800✯"         # 7  Gold
  - "&#FFD700✯"         # 8
  - "&#FFE866✯"         # 9
  - "&#3A9A5C❖"         # 10 Emerald
  - "&#50C878❖"         # 11
  - "&#8AE6A8❖"         # 12
  - "&#3FA8AD◆"         # 13 Diamond
  - "&#5CE1E6◆"         # 14
  - "&#A6F3F5◆"         # 15
  - "&#B07ACB✵"         # 16 Crystal
  - "&#E8B4FF✵"         # 17
  - "&#F4DAFF✵"         # 18
  - "&#FFFFFF✵"         # 19 Crystal (pure white)
  - "&#FF7EB3✪"         # 20 max rank
# Tier name for every rank (index = rank), for %trickiertrials_rank_tier%.
rank-tiers: [Unranked, Bronze, Bronze, Bronze, Silver, Silver, Silver, Gold, Gold, Gold,
             Emerald, Emerald, Emerald, Diamond, Diamond, Diamond, Crystal, Crystal, Crystal, Crystal, Prismatic]

# ─────────────────────────────── Run modifiers ──────────────────────────────
# Random twists rolled for every trial so no two runs are alike: BLOODLUST, FORTIFIED, FRENZY,
# ELITE_HUNT, GALE, LEECHING, GLASS_CANNON, DARKNESS, FAMINE, UNSTABLE, MOMENTUM, GOLDEN
modifiers:
  enabled: true
  base: 1                        # modifiers every trial gets
  extra-every-ranks: 5           # +1 modifier per this many Trial Ranks
  max: 4
  disabled: []

# ──────────────────────────────── Wave events ───────────────────────────────
# Normal waves (from wave 2) can turn into a special wave:
# ELITE_SURGE (elites everywhere, +50% score), SWARM (1.5x weaker, faster foes),
# BLITZ (clear in time for a reward), TREASURE (catch the Treasure Breeze for Trial Keys)
wave-events:
  chance: 0.35
  disabled: []
  blitz-seconds: 40              # base time; +3 seconds per required kill
  treasure-seconds: 35
  blitz-rewards:
    - "TRIAL_KEY 1 1.0"

# ───────────────────────────── Chamber Warden ───────────────────────────────
# A guard boss that patrols your corridor. While it lives, every trial spawner and vault within
# guard-radius of its post is sealed - nobody can start a trial. Kill it to open them all.
# After unseal-duration it comes back on its own and seals them again (running trials continue).
# Setup (stand in the corridor):  /trials warden create <name>   then walk the route and run
# /trials warden point <name> at each corner. The warden walks the points back and forth.
warden:
  enabled: true
  boss: juggernaut             # ability kit: tempest, bog-sovereign, juggernaut, brood-mother, rimeborn
  name: "<gradient:copper:gold><bold>Chamber Warden</bold></gradient>"
  health: 300
  damage: 1.2
  guard-radius: 64             # blocks around the post whose spawners & vaults are sealed
  aggro-range: 14              # how close players must come before it fights
  leash-range: 48              # it never strays further than this from its post
  unseal-duration: 1200        # seconds the trials stay open after it dies
  seal-vaults: true
  # Given to every player who helped kill it.
  rewards:
    - "TRIAL_KEY 1 1.0"

# ──────────────────────────── Weekly leaderboard ────────────────────────────
# Every trial adds its score to the player's weekly total. When the week ends, the top players get
# their prizes (items are handed out on their next join if offline) and the board starts fresh.
# Show it anywhere with PlaceholderAPI, e.g. in FancyHolograms:
#   %trickiertrials_weekly_name_1%  %trickiertrials_weekly_score_1%  %trickiertrials_weekly_reset%
weekly:
  enabled: true
  metric: total                  # total = all trial score this week, best = best single run
  reset-day: MONDAY
  reset-time: "00:00"
  timezone: "UTC"                # e.g. Europe/Berlin, Asia/Riyadh, America/New_York
  min-score: 1                   # score needed to receive a prize
  empty-slot: "-"                # shown for empty leaderboard places
  prizes:
    1:
      items: ["TRIAL_KEY 6 1.0"]
      commands: []               # run from console, e.g. "lp user %player% permission settemp title.weekly true 7d"
    2:
      items: ["TRIAL_KEY 4 1.0"]
      commands: []
    3:
      items: ["TRIAL_KEY 2 1.0"]
      commands: []

# ──────────────────────────────── Holograms ─────────────────────────────────
# /trials hologram <weekly|lastweek|top <category>> [name] creates a FancyHolograms hologram with these
# lines where you stand (needs FancyHolograms + PlaceholderAPI). Edit it later with /hologram edit.
holograms:
  update-interval: 5s
  weekly:
    - "<gradient:#E8875B:#F7C873><b>⚔ WEEKLY TRIALS ⚔</b></gradient>"
    - "<gray>Resets in <white>%trickiertrials_weekly_reset%"
    - "<#FFD700>#1 <white>%trickiertrials_weekly_name_1% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_1%"
    - "<#C0C0C0>#2 <white>%trickiertrials_weekly_name_2% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_2%"
    - "<#CD7F32>#3 <white>%trickiertrials_weekly_name_3% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_3%"
    - "<#9A9AA6>#4 <white>%trickiertrials_weekly_name_4% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_4%"
    - "<#9A9AA6>#5 <white>%trickiertrials_weekly_name_5% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_5%"
    - "<#9A9AA6>#6 <white>%trickiertrials_weekly_name_6% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_6%"
    - "<#9A9AA6>#7 <white>%trickiertrials_weekly_name_7% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_7%"
    - "<#9A9AA6>#8 <white>%trickiertrials_weekly_name_8% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_8%"
    - "<#9A9AA6>#9 <white>%trickiertrials_weekly_name_9% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_9%"
    - "<#9A9AA6>#10 <white>%trickiertrials_weekly_name_10% <dark_gray>- <#F7C873>%trickiertrials_weekly_score_10%"
    - "<gray>You: <white>#%trickiertrials_weekly_position% <dark_gray>- <#F7C873>%trickiertrials_weekly_score%"
  lastweek:
    - "<gradient:#F7C873:#E8875B><b>✦ LAST WEEK'S CHAMPIONS ✦</b></gradient>"
    - "<#FFD700>#1 <white>%trickiertrials_lastweek_name_1% <dark_gray>- <#F7C873>%trickiertrials_lastweek_score_1%"
    - "<#C0C0C0>#2 <white>%trickiertrials_lastweek_name_2% <dark_gray>- <#F7C873>%trickiertrials_lastweek_score_2%"
    - "<#CD7F32>#3 <white>%trickiertrials_lastweek_name_3% <dark_gray>- <#F7C873>%trickiertrials_lastweek_score_3%"
  # {category} = score, wave, kills, bosses, victories or rank; {title} = its name
  top:
    - "<gradient:#5CC8B5:#9AD8FF><b>⚔ {title} ⚔</b></gradient>"
    - "<#FFD700>#1 <white>%trickiertrials_top_{category}_name_1% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_1%"
    - "<#C0C0C0>#2 <white>%trickiertrials_top_{category}_name_2% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_2%"
    - "<#CD7F32>#3 <white>%trickiertrials_top_{category}_name_3% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_3%"
    - "<#9A9AA6>#4 <white>%trickiertrials_top_{category}_name_4% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_4%"
    - "<#9A9AA6>#5 <white>%trickiertrials_top_{category}_name_5% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_5%"
    - "<#9A9AA6>#6 <white>%trickiertrials_top_{category}_name_6% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_6%"
    - "<#9A9AA6>#7 <white>%trickiertrials_top_{category}_name_7% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_7%"
    - "<#9A9AA6>#8 <white>%trickiertrials_top_{category}_name_8% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_8%"
    - "<#9A9AA6>#9 <white>%trickiertrials_top_{category}_name_9% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_9%"
    - "<#9A9AA6>#10 <white>%trickiertrials_top_{category}_name_10% <dark_gray>- <#F7C873>%trickiertrials_top_{category}_value_10%"

# ──────────────────────────────── Rewards ───────────────────────────────────
# Trial Keys go only to players who actually fought. A player counts as a contributor when the damage
# they dealt is at least this share of the average damage per player in that fight (0.25 = a quarter
# of an equal share). Standing nearby or AFK earns nothing. Applies to the Warden, bosses, victories,
# Blitz waves and the Treasure Breeze (only players who hit it); elite keys go to the killer.
rewards:
  min-contribution: 0.25

# ───────────────────────────── Score & combos ───────────────────────────────
score:
  kill: 10
  elite: 40
  boss: 300
  wave-clear: 100
  victory: 1000
  death-penalty: 150
combo:
  window: 6                    # seconds between kills to keep the combo alive
  multiplier-per-kill: 0.1
  max-multiplier: 3.0

# ───────────────────────────────── Encounters ───────────────────────────────
session:
  enabled: true
  # Used when a trial spawner is NOT inside a generated trial chamber (custom builds).
  fallback-radius: 40
  idle-timeout: 30             # seconds without players before the encounter is abandoned
  victory-cooldown: 600        # seconds before a conquered chamber can start a new encounter
  bossbar: true
  actionbar: true
  titles: true
  sounds: true
  broadcast-victories: true    # announce conquered chambers to the whole server

# ──────────────────────────────── Trial vaults ──────────────────────────────
vault-reset:
  enabled: true
  cooldown: 86400              # seconds until a player can open the same vault again. -1 = never

# ───────────────────────────────── Messages ─────────────────────────────────
messages:
  prefix: "<gradient:copper:gold><bold>TRIALS</bold></gradient> <dark_gray>»</dark_gray> "
  reload: "<success>Configuration reloaded.</success>"
  no-permission: "<danger>You don't have permission to do that.</danger>"
  player-only: "<danger>Only players can use this.</danger>"
  not-in-session: "<muted>You are not inside an active trial encounter.</muted>"
  unknown-player: "<danger>No stats found for <light><name></light>.</danger>"
  unknown-boss: "<danger>Unknown boss. Options: <light><options></light></danger>"
  session-ended-admin: "<muted>Encounter ended.</muted>"
  help:
    - "<gradient:copper:gold><bold>TrickierTrials</bold></gradient> <muted>v<version></muted>"
    - "<copper>/trials info</copper> <muted>- your current encounter</muted>"
    - "<copper>/trials stats [player]</copper> <muted>- personal records</muted>"
    - "<copper>/trials top [score|wave|kills|bosses|victories|rank]</copper> <muted>- leaderboard</muted>"
    - "<copper>/trials weekly</copper> <muted>- this week's leaderboard</muted>"
    - "<copper>/trials hologram <weekly|lastweek|top></copper> <muted>- create a leaderboard hologram (admin)</muted>"
    - "<copper>/trials rank <player> <0-20></copper> <muted>- set a Trial Rank (admin)</muted>"
    - "<copper>/trials boss <type></copper> <muted>- summon a boss (admin)</muted>"
    - "<copper>/trials warden <create|point|respawn|open|remove|list> <name></copper> <muted>- chamber guard (admin)</muted>"
    - "<copper>/trials end</copper> <muted>- end your encounter (admin)</muted>"
    - "<copper>/trials reload</copper> <muted>- reload the config (admin)</muted>"

  # Encounter flow
  session-start-title: "<gradient:copper:gold><bold>TRIAL BEGINS</bold></gradient>"
  session-start-subtitle: "<muted>Rank</muted> <stars> <muted>· Survive <light><waves></light> waves · <light><players></light> challenger(s)</muted>"
  session-modifiers: "<muted>Trial Rank</muted> <stars> <dark_gray>·</dark_gray> <muted>Modifiers:</muted> <modifiers> <dark_gray>(hover)</dark_gray>"
  session-start-title-ominous: "<gradient:ominous:danger><bold>OMINOUS TRIAL</bold></gradient>"
  session-join: "<light><player></light> <muted>entered the trial on wave</muted> <teal><wave></teal>"
  wave-start-title: "<gradient:teal:sky><bold>WAVE <wave></bold></gradient>"
  wave-start-subtitle: "<muted>Slay <light><target></light> foes</muted>"
  wave-clear-title: "<success><bold>WAVE CLEARED</bold></success>"
  wave-clear-subtitle: "<muted>+<gold><points></gold> points · next wave in <light><seconds>s</light></muted>"
  boss-incoming-title: "<gradient:ominous:danger><bold>⚠ BOSS WAVE ⚠</bold></gradient>"
  boss-incoming-subtitle: "<boss><affixes>"
  boss-enrage: "<danger><bold>⚡</bold></danger> <boss> <danger>is enraged!</danger>"
  boss-defeated-title: "<gradient:gold:copper><bold>BOSS DEFEATED</bold></gradient>"
  boss-defeated-subtitle: "<boss> <muted>has fallen</muted>"
  boss-defeated-chat: "<gold>✦</gold> <boss> <muted>was slain by</muted> <light><player></light> <muted>in</muted> <light><time></light>"
  wave-event-subtitle: "<event> <dark_gray>·</dark_gray> <muted><description></muted>"
  wave-event: "<gold>✦</gold> <muted>Special wave:</muted> <event> <dark_gray>-</dark_gray> <muted><description></muted>"
  blitz-won: "<success>Blitz cleared in time!</success> <muted>Bonus reward granted.</muted>"
  blitz-failed: "<danger>Blitz failed</danger> <muted>- the timer ran out.</muted>"
  treasure-caught: "<gold>✦</gold> <light><player></light> <muted>caught the Treasure Breeze!</muted> <gold><keys> Trial Key(s)</gold> <muted>each for the hunters.</muted>"
  treasure-escaped: "<muted>The Treasure Breeze escaped...</muted>"
  rank-progress: "<gold>✦</gold> <muted>Rank progress:</muted> <gold><have>/<need></gold> <muted>wins towards</muted> <stars>"
  rank-progress-lost: "<danger>Trial failed</danger> <muted>- rank progress dropped to</muted> <gold><have>/<need></gold>"
  rank-no-progress-below: "<muted>This win did not count towards your rank - the trial's rank was below yours.</muted> <gold><have>/<need></gold>"
  rank-no-progress-deaths: "<muted>This win did not count towards your rank - you died more than <max_deaths> time(s).</muted> <gold><have>/<need></gold>"
  rank-no-progress-late: "<muted>This win did not count towards your rank - you joined after wave <join_wave>.</muted> <gold><have>/<need></gold>"
