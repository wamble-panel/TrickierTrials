name: TrickierTrials
version: '${version}'
main: de.t14d3.trickiertrials.TrickierTrials
author: t14d3
description: Waves, bosses, elite mobs, combos and leaderboards for Trial Chambers.
api-version: '26.2'
commands:
  trickiertrials:
    description: Trial encounters, stats and leaderboards
    usage: /<command> [info|stats|top|boss|end|reload]
    aliases: [trials, tt]
permissions:
  trickiertrials.admin:
    description: Reload the config, summon bosses and end encounters
    default: op
